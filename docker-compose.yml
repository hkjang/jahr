services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:16-alpine
    container_name: jahr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jahr
    ports:
      - "5432:5432"
    volumes:
      - jahr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jahr-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/jahr?schema=public
      - AUTH_SECRET=super-secret-key-for-production-change-me
      - AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=JaHR
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  jahr-postgres-data:
