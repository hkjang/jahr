services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:16-alpine
    container_name: jahr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jahr
    ports:
      - "5432:5432"
    volumes:
      - jahr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jahr-postgres-data:
